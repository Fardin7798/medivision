# MediVision Configuration File

project:
  name: "MediVision"
  version: "1.0.0"
  description: "3D Medical Image AI Segmentation, Registration & Navigation System"
  disclaimer: "RESEARCH AND EDUCATIONAL PROTOTYPE ONLY. NOT FOR CLINICAL USE."

dataset:
  task_name: "Task02_Heart"
  download_url: "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task02_Heart.tar"
  md5: "06ee59366e1e5124267b774dbd654057"
  data_dir: "./data"
  val_split: 0.2
  seed: 42

preprocessing:
  target_spacing: [1.0, 1.0, 1.0] # isotropic mm
  intensity_clip_percentiles: [1.0, 99.0]
  roi_size: [96, 96, 96] # patch size for 3D sliding window
  sw_overlap: 0.25

model:
  baseline:
    in_channels: 1
    out_channels: 2 # 0: background, 1: left atrium
    channels: [16, 32, 64, 128, 256]
    strides: [2, 2, 2, 2]
    num_res_units: 2
    dropout: 0.1
  multichannel:
    in_channels: 4 # 0: intensity, 1: sobel, 2: laplacian, 3: gabor
    out_channels: 2
    channels: [16, 32, 64, 128, 256]
    strides: [2, 2, 2, 2]
    num_res_units: 2
    dropout: 0.1

training:
  batch_size: 2
  learning_rate: 0.0002
  weight_decay: 0.00001
  max_epochs: 100
  val_interval: 2
  mixed_precision: true

hub:
  repo_id: "shaikhfardin/medivision-unet-heart"
  checkpoint_filename: "unet_heart_best.pth"
  local_checkpoint_dir: "./models"

registration:
  transform_type: "Euler3D" # Rigid 6-DOF
  metric: "MattesMutualInformation"
  number_of_histogram_bins: 50
  learning_rate: 1.0
  min_step: 0.001
  number_of_iterations: 200

reconstruction:
  step_size: 1
  smooth_iterations: 15
  smooth_relaxation: 0.1
