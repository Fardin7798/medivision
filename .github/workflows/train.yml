name: Train MediVision U-Net (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: false
        default: "100"
      batch_size:
        description: "Batch size"
        required: false
        default: "2"

env:
  KAGGLE_SLUG: "shaikhfardin05/medivision-u-net-training"

jobs:
  run_kaggle_training:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Build Kaggle kernel (script + metadata)
        run: |
          mkdir -p kaggle_job
          cat > kaggle_job/kernel-metadata.json << EOF
          {
            "id": "$KAGGLE_SLUG",
            "title": "MediVision U-Net Training",
            "code_file": "kaggle_train.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "true",
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": []
          }
          EOF
          cat > kaggle_job/kaggle_train.py << PYEOF
          import os, subprocess, sys

          REPO_URL = "https://github.com/Fardin7798/medivision.git"
          os.environ["HF_TOKEN"] = "${{ secrets.HF_TOKEN }}"

          subprocess.run(["git", "clone", "--depth", "1", REPO_URL, "/kaggle/working/medivision"], check=True)
          os.chdir("/kaggle/working/medivision")
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "-r", "requirements.txt"], check=True)
          subprocess.run([
              sys.executable, "-m", "backend.app.train",
              "--epochs", "${{ github.event.inputs.epochs }}",
              "--batch-size", "${{ github.event.inputs.batch_size }}",
          ], check=True)
          PYEOF

      - name: Push kernel to Kaggle
        run: |
          cd kaggle_job
          kaggle kernels push -p .

      - name: Poll kernel status until finished
        run: |
          for i in $(seq 1 120); do
            raw=$(kaggle kernels status "$KAGGLE_SLUG" 2>&1)
            status=$(echo "$raw" | grep -oP 'KernelWorkerStatus\.\K[A-Za-z]+' || echo "unknown")
            echo "[poll $i] raw: $raw | parsed: $status"
            if [ "$status" = "complete" ] || [ "$status" = "COMPLETE" ]; then
              echo "Kernel finished successfully."
              break
            fi
            if [ "$status" = "error" ] || [ "$status" = "ERROR" ]; then
              echo "Kernel failed."
              exit 1
            fi
            sleep 30
          done

      - name: Fetch kernel output logs
        if: always()
        run: |
          mkdir -p kernel_output
          kaggle kernels output "$KAGGLE_SLUG" -p kernel_output || true
          echo "--- kernel log tail ---"
          find kernel_output -type f -exec tail -n 200 {} \;
